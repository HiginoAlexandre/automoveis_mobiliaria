<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaturas | Eduardo Automóveis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/viaturas.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/utility.css">
    <style>
        /* Estilos específicos da página de viaturas */
        .viaturas-page {
            padding-top: 30px;
        }

        /* Barra de filtros */
        .filtros-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            padding: 30px;
            margin-bottom: 40px;
        }

        .filtros-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filtros-titulo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filtros-titulo h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1E1E1E;
        }

        .filtros-titulo i {
            color: #0F6B3A;
            font-size: 1.2rem;
        }

        .reset-filtros-btn {
            background: transparent;
            border: 1px solid #0F6B3A;
            color: #0F6B3A;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .reset-filtros-btn:hover {
            background: #0F6B3A;
            color: #fff;
        }

        /* Grupos de filtros */
        .filtros-grupo {
            margin-bottom: 25px;
        }

        .filtros-grupo h4 {
            font-size: 1rem;
            font-weight: 600;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filtros-opcoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filtro-btn {
            padding: 10px 20px;
            border: 1px solid #E9ECEF;
            background: #F8F9FA;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1E1E1E;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filtro-btn i {
            font-size: 0.9rem;
            color: #3FA66A;
        }

        .filtro-btn:hover {
            background: #E9ECEF;
            transform: translateY(-2px);
        }

        .filtro-btn.active {
            background: #0F6B3A;
            color: #fff;
            border-color: #0F6B3A;
        }

        .filtro-btn.active i {
            color: #fff;
        }

        /* Marcas grid */
        .marcas-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 5px 0;
            max-width: 100%;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .marca-btn {
            padding: 10px 20px;
            background: #F8F9FA;
            border: 1px solid #E9ECEF;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1E1E1E;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .marca-btn i {
            color: #3FA66A;
            font-size: 1rem;
        }

        .marca-btn:hover {
            background: #E9ECEF;
            transform: translateY(-2px);
        }

        .marca-btn.active {
            background: #0F6B3A;
            color: #fff;
            border-color: #0F6B3A;
        }

        .marca-btn.active i {
            color: #fff;
        }

        /* Barra de pesquisa */
        .pesquisa-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .pesquisa-input {
            flex: 1;
            padding: 15px 20px;
            border: 1px solid #E9ECEF;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .pesquisa-input:focus {
            outline: none;
            border-color: #0F6B3A;
            box-shadow: 0 0 0 3px rgba(15, 107, 58, 0.1);
        }

        .pesquisa-btn {
            padding: 15px 30px;
            background: #0F6B3A;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .pesquisa-btn:hover {
            background: #3FA66A;
            transform: translateY(-2px);
        }

        /* Info e paginação */
        .resultados-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .contador {
            font-size: 1rem;
            color: #666;
        }

        .contador strong {
            color: #0F6B3A;
            font-size: 1.1rem;
        }

        .paginacao {
            display: flex;
            gap: 10px;
        }

        .pagina-btn {
            width: 45px;
            height: 45px;
            border: 1px solid #E9ECEF;
            background: #fff;
            border-radius: 10px;
            color: #1E1E1E;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagina-btn:hover:not(:disabled) {
            background: #0F6B3A;
            color: #fff;
            border-color: #0F6B3A;
        }

        .pagina-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagina-info {
            padding: 0 15px;
            display: flex;
            align-items: center;
            font-weight: 600;
            color: #1E1E1E;
        }

        /* Grid de carros */
        .cars-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }

        /* Mensagem sem resultados */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: #F8F9FA;
            border-radius: 16px;
            margin: 40px 0;
        }

        .no-results i {
            font-size: 4rem;
            color: #ccc;
            margin-bottom: 20px;
        }

        .no-results h3 {
            font-size: 1.5rem;
            color: #1E1E1E;
            margin-bottom: 10px;
        }

        .no-results p {
            color: #666;
            margin-bottom: 20px;
        }

        .no-results button {
            padding: 12px 30px;
            background: #0F6B3A;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .no-results button:hover {
            background: #3FA66A;
        }

        /* Responsivo */
        @media (max-width: 1200px) {
            .cars-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .filtros-container {
                padding: 20px;
            }

            .cars-grid {
                grid-template-columns: 1fr;
            }

            .pesquisa-container {
                flex-direction: column;
            }

            .resultados-info {
                flex-direction: column;
                align-items: flex-start;
            }

            .paginacao {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .filtros-opcoes {
                flex-direction: column;
            }

            .filtro-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="main-header" id="mainHeader">
        <div class="header-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">EA</div>
                <div class="logo-text">
                    <span class="logo-main">Eduardo Automóveis</span>
                    <span class="logo-sub">B.Eduardo Investimento</span>
                </div>
            </a>

            <nav class="nav-desktop">
                <ul class="nav-menu">
                    <li class="nav-item"><a href="index.html" class="nav-link">Início</a></li>
                    <li class="nav-item"><a href="viaturas.html" class="nav-link active">Viaturas</a></li>
                    <li class="nav-item"><a href="sobre.html" class="nav-link">Sobre</a></li>
                    <li class="nav-item"><a href="contacto.html" class="nav-link">Contacto</a></li>
                </ul>
                <button class="cta-button" id="headerCta">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </button>
            </nav>

            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <nav class="nav-mobile" id="navMobile">
            <ul class="mobile-menu">
                <li class="mobile-item"><a href="index.html" class="nav-link">Início</a></li>
                <li class="mobile-item"><a href="viaturas.html" class="nav-link active">Viaturas</a></li>
                <li class="mobile-item"><a href="sobre.html" class="nav-link">Sobre</a></li>
                <li class="mobile-item"><a href="contacto.html" class="nav-link">Contacto</a></li>
            </ul>
            <button class="cta-button mobile-cta" id="mobileCta">
                <i class="fab fa-whatsapp"></i> Solicitar visita
            </button>
        </nav>
        <div class="overlay" id="overlay"></div>
    </header>

    <main class="viaturas-page">
        <div class="viaturas-container">
            <!-- Filtros -->
            <div class="filtros-container">
                <div class="filtros-header">
                    <div class="filtros-titulo">
                        <i class="fas fa-sliders-h"></i>
                        <h3>Filtrar Viaturas</h3>
                    </div>
                    <button class="reset-filtros-btn" id="resetFiltrosBtn">
                        <i class="fas fa-undo-alt"></i> Limpar filtros
                    </button>
                </div>

                <!-- Filtro por condição -->
                <div class="filtros-grupo">
                    <h4>Condição</h4>
                    <div class="filtros-opcoes" id="filtroCondicao">
                        <button class="filtro-btn active" data-filtro="todos">
                            <i class="fas fa-car"></i> Todos
                        </button>
                        <button class="filtro-btn" data-filtro="novo">
                            <i class="fas fa-star"></i> Novos
                        </button>
                        <button class="filtro-btn" data-filtro="usado">
                            <i class="fas fa-history"></i> Usados
                        </button>
                    </div>
                </div>

                <!-- Filtro por marcas -->
                <div class="filtros-grupo">
                    <h4>Marcas</h4>
                    <div class="marcas-grid" id="marcasGrid">
                        <!-- Marcas serão inseridas via JavaScript -->
                    </div>
                </div>

                <!-- Pesquisa -->
                <div class="pesquisa-container">
                    <input type="text" class="pesquisa-input" id="pesquisaInput" 
                           placeholder="Pesquisar por modelo, ano, cor...">
                    <button class="pesquisa-btn" id="pesquisaBtn">
                        <i class="fas fa-search"></i> Pesquisar
                    </button>
                </div>
            </div>

            <!-- Resultados e Paginação -->
            <div class="resultados-info">
                <div class="contador" id="contadorResultados">
                    Mostrando <strong id="mostrandoInicio">1</strong> - <strong id="mostrandoFim">6</strong> de <strong id="totalResultados">0</strong> carros
                </div>
                <div class="paginacao" id="paginacao">
                    <button class="pagina-btn" id="paginaAnterior" disabled>
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span class="pagina-info" id="paginaInfo">Página 1</span>
                    <button class="pagina-btn" id="paginaProxima" disabled>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- Grid de Carros -->
            <div class="cars-grid" id="carsGrid">
                <!-- Carros serão inseridos via JavaScript -->
                <div class="car-card-loading"></div>
                <div class="car-card-loading"></div>
                <div class="car-card-loading"></div>
            </div>

            <!-- Mensagem sem resultados -->
            <div class="no-results" id="noResults" style="display: none;">
                <i class="fas fa-search"></i>
                <h3>Nenhum carro encontrado</h3>
                <p>Tente ajustar os filtros ou a pesquisa.</p>
                <button onclick="window.resetarFiltros()">Ver todos os carros</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <!-- ... footer content (igual ao index.html) ... -->
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/header.js"></script>
    <script src="js/viaturas-page.js"></script>
    <script src="js/footer.js"></script>
</body>

</html>
